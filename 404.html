<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teenspace - Page Not Found (404)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #07080c;
      --card-bg: rgba(16, 18, 27, 0.75);
      --border-glow: rgba(236, 72, 153, 0.2);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --pink: #ec4899;
      --purple: #a855f7;
      --blue: #3b82f6;
      --gradient-brand: linear-gradient(135deg, #ec4899 0%, #a855f7 50%, #3b82f6 100%);
      --radius-xl: 24px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Ambient dynamic glow effects */
    body::before {
      content: '';
      position: absolute;
      top: -15vh;
      left: -15vw;
      width: 55vw;
      height: 55vw;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.12) 0%, rgba(0,0,0,0) 70%);
      z-index: -1;
      filter: blur(40px);
    }

    body::after {
      content: '';
      position: absolute;
      bottom: -15vh;
      right: -15vw;
      width: 55vw;
      height: 55vw;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, rgba(0,0,0,0) 70%);
      z-index: -1;
      filter: blur(40px);
    }

    .error-shell {
      width: 100%;
      max-width: 540px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 48px 32px;
      text-align: center;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8), 0 0 30px rgba(168, 85, 247, 0.05);
      position: relative;
      overflow: hidden;
      animation: zoomIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .error-shell::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--gradient-brand);
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .brand-logo {
      font-weight: 800;
      font-size: 1.6rem;
      letter-spacing: -0.03em;
      color: #ffffff;
      margin-bottom: 32px;
    }

    .brand-logo span {
      background: var(--gradient-brand);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .error-code {
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.05em;
      background: var(--gradient-brand);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      text-shadow: 0 10px 30px rgba(168, 85, 247, 0.2);
    }

    .error-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .error-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 36px;
      padding: 0 10px;
    }

    .action-row {
      display: flex;
      gap: 14px;
      justify-content: center;
    }

    .btn {
      padding: 14px 28px;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-main {
      background: var(--gradient-brand);
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(236, 72, 153, 0.35);
    }

    .btn-main:hover {
      opacity: 0.92;
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(236, 72, 153, 0.5);
    }

    .btn-alt {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
    }

    .btn-alt:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.15);
    }

    @media(max-width: 480px) {
      .error-shell { padding: 36px 20px; }
      .error-code { font-size: 5rem; }
      .action-row { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="error-shell">
    <div class="brand-logo">teenspace<span>.</span></div>
    
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">Oops! The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>

    <div class="action-row">
      <a href="register.html" class="btn btn-main">&larr; Back to Registration</a>
      <button type="button" class="btn btn-alt" onclick="window.location.reload()">Refresh Page</button>
    </div>
  </div>

</body>
</html>
