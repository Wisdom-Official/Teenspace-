<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt Generator – Sarga Vasantham 2026-27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#1c2233;--mut:#6b7385;--line:#dfe3ee;--brand:#2b4a9b;--brand-d:#1f3777;--acc:#d6336c;--ok:#12805c}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;padding:22px 20px}
header .in{max-width:1180px;margin:auto}
header h1{margin:0;font-size:clamp(18px,3vw,24px);font-weight:700}
header p{margin:4px 0 0;opacity:.85;font-size:14px}
main{max-width:1180px;margin:24px auto;padding:0 16px 40px;display:grid;grid-template-columns:360px 1fr;gap:22px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(30,40,80,.05)}
.card h2{margin:0 0 14px;font-size:16px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input,select{width:100%;padding:11px 12px;font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);transition:.15s}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(43,74,155,.15)}
.hint{font-size:12px;color:var(--mut);margin-top:5px}
.row{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px}
.row input{width:auto}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
button{font:inherit;font-weight:600;font-size:14px;padding:12px;border:0;border-radius:10px;cursor:pointer;transition:.15s}
.pri{background:var(--brand);color:#fff;grid-column:1/-1}
.pri:hover{background:var(--brand-d)}
.sec{background:#eef1f9;color:var(--brand)}
.sec:hover{background:#e2e8f6}
button:disabled{opacity:.6;cursor:wait}
.prev{position:sticky;top:16px}
.stage{width:100%;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.rc{position:relative;width:100%;line-height:0}
.rc>img.bg{width:100%;display:block;user-select:none}
.f{position:absolute;display:flex;align-items:flex-end;overflow:visible;line-height:1.25;color:#13204a;white-space:nowrap}
.f span{display:inline-block;white-space:nowrap;padding-top:.1em}
.hw .f{font-family:Caveat,cursive;font-weight:600}
.pt .f{font-family:Inter,sans-serif;font-weight:500}
.f.c{justify-content:center;align-items:center}
#date{left:75.5%;width:18.5%;top:39.8%;height:4.2%}
#name{left:31.8%;width:62.2%;top:47.8%;height:4.6%}
#words{left:23.5%;width:64.5%;top:55.8%;height:4.6%}
#amt{left:11.6%;width:17%;top:70.8%;height:10.1%}
#sig{left:71.5%;width:21%;top:60.6%;height:15.6%;align-items:flex-end;justify-content:center}
#sig img{max-width:100%;max-height:100%;display:block}
.tip{font-size:12.5px;color:var(--mut);margin:10px 2px 0}
@media(max-width:900px){main{grid-template-columns:1fr}.prev{position:static;order:-1}}
</style>
</head>
<body>
<header><div class="in"><h1>Donation Receipt Generator</h1><p>Sarga Vasantham 2026-27 · Fill in the details and download</p></div></header>
<main>
  <section class="card">
    <h2>Receipt details</h2>
    <label for="inDate">Date</label>
    <input type="date" id="inDate">
    <label for="inName">Received from (name)</label>
    <input type="text" id="inName" placeholder="e.g. Mohammed Ashraf K" autocomplete="off">
    <label for="inAmt">Amount (₹)</label>
    <input type="text" id="inAmt" inputmode="numeric" placeholder="e.g. 5000" autocomplete="off">
    <label for="inWords">Amount in words <span style="font-weight:400;color:var(--mut)">(auto)</span></label>
    <input type="text" id="inWords" placeholder="Filled automatically">
    <p class="hint">Edit the words only if you need to change them.</p>
    <label for="inStyle">Text style</label>
    <select id="inStyle"><option value="hw">Handwriting</option><option value="pt">Printed</option></select>
    <div class="row"><input type="checkbox" id="inSig" checked><label for="inSig" style="margin:0;font-weight:500">Include convener signature</label></div>
    <div class="btns">
      <button class="pri" id="bPdf">Download PDF</button>
      <button class="sec" id="bImg">Download Image</button>
      <button class="sec" id="bReset">Reset</button>
    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const rc=$('rc'), inDate=$('inDate'), inName=$('inName'), inAmt=$('inAmt'), inWords=$('inWords'), inStyle=$('inStyle'), inSig=$('inSig');
let wordsEdited=false;

const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function below100(n){return n<20?ones[n]:tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'')}
function below1000(n){const h=Math.floor(n/100),r=n%100;return (h?ones[h]+' Hundred':'')+(h&&r?' and ':'')+(r?below100(r):'')}
function toWords(n){
  if(!n) return '';
  const parts=[];
  const cr=Math.floor(n/1e7); n%=1e7;
  const lk=Math.floor(n/1e5); n%=1e5;
  const th=Math.floor(n/1e3); n%=1e3;
  if(cr)parts.push(below100(cr)+' Crore');
  if(lk)parts.push(below100(lk)+' Lakh');
  if(th)parts.push(below100(th)+' Thousand');
  if(n)parts.push(below1000(n));
  return parts.join(' ');
}
function fmtDate(v){if(!v)return '';const [y,m,d]=v.split('-');return `${d}/${m}/${y}`}
function fmtAmt(){const n=parseInt(inAmt.value.replace(/\D/g,''),10);return n?n.toLocaleString('en-IN')+'/-':''}

function fill(root){
  root.className='rc '+inStyle.value;
  const set=(id,t)=>root.querySelector('#'+id+' span').textContent=t;
  set('date',fmtDate(inDate.value));
  set('name',inName.value.trim());
  set('words',inWords.value.trim());
  set('amt',fmtAmt());
  root.querySelector('#sig').style.visibility=inSig.checked?'visible':'hidden';
  fit(root);
}
function fit(root){
  const W=root.clientWidth||root.getBoundingClientRect().width;
  root.querySelectorAll('.f[data-s]').forEach(el=>{
    const sp=el.firstElementChild;
    let size=W*parseFloat(el.dataset.s)/100*(root.classList.contains('hw')?1.12:0.82);
    sp.style.fontSize=size+'px';
    let g=60;
    while(sp.scrollWidth>el.clientWidth && size>6 && g--){size-=1;sp.style.fontSize=size+'px'}
  });
}
function render(){fill(rc)}

inAmt.addEventListener('input',()=>{
  const digits=inAmt.value.replace(/\D/g,'');
  inAmt.value=digits?parseInt(digits,10).toLocaleString('en-IN'):'';
  if(!wordsEdited){const n=parseInt(digits,10);inWords.value=n?toWords(n):''}
  render();
});
inWords.addEventListener('input',()=>{wordsEdited=inWords.value.trim()!=='';render()});
[inDate,inName,inStyle,inSig].forEach(e=>e.addEventListener('input',render));
window.addEventListener('resize',render);
document.fonts&&document.fonts.ready.then(render);

$('bReset').onclick=()=>{inDate.valueAsDate=new Date();inName.value='';inAmt.value='';inWords.value='';wordsEdited=false;render()};
inDate.valueAsDate=new Date();

async function capture(){
  if(document.fonts)await document.fonts.ready;
  const host=document.createElement('div');
  host.style.cssText='position:fixed;left:-10000px;top:0;width:990px;background:#fff';
  const clone=rc.cloneNode(true);
  host.appendChild(clone);document.body.appendChild(host);
  fill(clone);
  await new Promise(r=>requestAnimationFrame(r));
  const cv=await html2canvas(clone,{scale:3,backgroundColor:'#ffffff',useCORS:true,logging:false});
  document.body.removeChild(host);
  return cv;
}
function fileBase(){
  const n=(inName.value.trim()||'receipt').replace(/[^\w\-]+/g,'_').slice(0,30);
  return `Receipt_${n}_${(inDate.value||'').replace(/-/g,'')}`;
}
async function run(btn,fn){
  const t=btn.textContent;btn.disabled=true;btn.textContent='Preparing…';
  try{await fn()}catch(e){console.error(e);alert('Sorry, the download failed. Please try again.')}
  btn.disabled=false;btn.textContent=t;
}
$('bPdf').onclick=e=>run(e.target,async()=>{
  const cv=await capture();
  const {jsPDF}=window.jspdf;
  const w=210,h=w*cv.height/cv.width;
  const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:[w,h]});
  pdf.addImage(cv.toDataURL('image/jpeg',0.95),'JPEG',0,0,w,h);
  pdf.save(fileBase()+'.pdf');
});
$('bImg').onclick=e=>run(e.target,async()=>{
  const cv=await capture();
  const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=fileBase()+'.png';a.click();
});
render();
</script>
</body>
